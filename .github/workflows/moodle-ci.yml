name: Moodle Plugin CI

# Run on pull requests, on pushes to main and tags, and by hand. Running on a push to any branch ran the whole
# matrix twice for every push to a PR branch (once per event).
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The checks, Moodle/PHP/database matrix and settings live in verzog/moodle-ci-workflows.
  ci:
    uses: verzog/moodle-ci-workflows/.github/workflows/moodle-plugin-ci.yml@v1
