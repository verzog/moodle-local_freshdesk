name: Publish a tag to Moodle Marketplace

# Manually (re)publish a specific existing tag to Moodle Marketplace.
#
# Automatic publishing on a version bump happens in release.yml (its
# publish-marketplace job). This workflow is the on-demand equivalent — use it
# to publish a tag that predates the automation, or to retry a failed publish,
# without cutting a new version. It calls the same official moodlehq reusable
# workflow and needs the MOODLE_MARKETPLACE_TOKEN repository secret (an API
# token from https://marketplace.moodle.com/account/security). See issue #57.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v2.4.8)'
        required: true

jobs:
  publish-marketplace:
    name: Publish version to Moodle Marketplace
    uses: moodlehq/moodle-plugin-release/.github/workflows/moodle-release.yml@main
    with:
      tag: ${{ github.event.inputs.tag }}
    secrets:
      MOODLE_MARKETPLACE_TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}
