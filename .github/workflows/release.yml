name: Release

# When the version in version.php is bumped on the default branch this:
#   1. tags the commit vX.Y.Z, builds the plugin ZIP, and creates a GitHub
#      release whose notes come from the matching CHANGES.md section; then
#   2. publishes the new version to Moodle Marketplace by calling the official
#      moodlehq/moodle-plugin-release reusable workflow (the publish-marketplace
#      job below), which POSTs to the Marketplace plugin-versions API.
#
# The Marketplace step needs a repository secret named MOODLE_MARKETPLACE_TOKEN
# (an API token from https://marketplace.moodle.com/account/security). Without
# it the publish-marketplace job fails while the tag/ZIP/GitHub release still
# succeed. See issue #57.

on:
  push:
    branches:
      - main
    paths:
      - version.php
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      newtag: ${{ steps.tagcheck.outputs.exists == 'false' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin metadata from version.php
        id: meta
        run: |
          # Define the Moodle constants version.php relies on so it can be
          # required standalone (outside a Moodle install).
          read_meta() {
            php -r '
              define("MOODLE_INTERNAL", true);
              define("MATURITY_ALPHA", 50);
              define("MATURITY_BETA", 100);
              define("MATURITY_RC", 150);
              define("MATURITY_STABLE", 200);
              $plugin = new stdClass();
              require "version.php";
              echo $plugin->'"$1"';
            '
          }
          release=$(read_meta release)
          version=$(read_meta version)
          component=$(read_meta component)
          if [ -z "$release" ] || [ -z "$version" ] || [ -z "$component" ]; then
            echo "::error::Could not read release/version/component from version.php"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "tag=v$release" >> "$GITHUB_OUTPUT"
          echo "Detected $component release $release (version $version)"

      - name: Check whether the tag already exists
        id: tagcheck
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.meta.outputs.tag }} already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin ZIP
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          # Moodle expects the archive to extract into a folder named after the
          # plugin's leaf name (the part after local_).
          plugindir="${{ steps.meta.outputs.component }}"
          plugindir="${plugindir#local_}"
          mkdir -p "build/$plugindir"
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' \
            ./ "build/$plugindir/"
          (cd build && zip -r -q "../${{ steps.meta.outputs.component }}-${{ steps.meta.outputs.tag }}.zip" "$plugindir")
          echo "Built ${{ steps.meta.outputs.component }}-${{ steps.meta.outputs.tag }}.zip"

      - name: Create tag and GitHub release
        if: steps.tagcheck.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          release="${{ steps.meta.outputs.release }}"
          git tag "$tag"
          git push origin "$tag"

          # Prefer the hand-written CHANGES.md section for this release as the
          # release notes; fall back to auto-generated notes if there is no
          # matching section. The awk block prints from the "## <release>"
          # heading up to (but not including) the next "## " heading.
          notes_file="$(mktemp)"
          if [ -f CHANGES.md ]; then
            awk -v ver="$release" '
              /^## / {
                if (grab) { exit }
                if ($0 ~ "^## " ver "([ ]|$)") { grab = 1 }
              }
              grab { print }
            ' CHANGES.md > "$notes_file"
          fi

          if [ -s "$notes_file" ]; then
            gh release create "$tag" \
              --title "$tag" \
              --notes-file "$notes_file" \
              "${{ steps.meta.outputs.component }}-$tag.zip"
          else
            echo "No CHANGES.md section for $release; using auto-generated notes."
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              "${{ steps.meta.outputs.component }}-$tag.zip"
          fi

  # Publishes the freshly tagged version to Moodle Marketplace via the official
  # moodlehq reusable workflow. Runs only when the release job created a new tag.
  # The reusable workflow resolves the tag, zips the plugin, pulls the release
  # notes from the GitHub release created above, and POSTs to
  # https://marketplace.moodle.com/api/plugins/<component>/versions using the
  # MOODLE_MARKETPLACE_TOKEN bearer token.
  publish-marketplace:
    name: Publish version to Moodle Marketplace
    needs: release
    if: needs.release.outputs.newtag == 'true'
    uses: moodlehq/moodle-plugin-release/.github/workflows/moodle-release.yml@main
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      MOODLE_MARKETPLACE_TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}
